name: Scheduled Telegram Briefings

on:
  schedule:
    # 07:30 KST (22:30 UTC previous day) - Daily Morning Briefing
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force send even if already sent today'
        required: false
        default: false
        type: boolean

jobs:
  send-briefing:
    name: Run Telegram Morning Briefing (07:30)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Execute Daily 07:30 Morning Briefing
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          echo "Executing 07:30 KST Daily Morning Briefing $FORCE_FLAG..."
          node scripts/sendTelegramBriefing.mjs morning $FORCE_FLAG
