name: Scheduled Telegram Briefings

on:
  schedule:
    # 07:25 KST (22:25 UTC previous day) - Optimal traffic minimum trigger for Morning Briefings
    - cron: '25 22 * * *'
    # 07:35 KST (22:35 UTC previous day) - Fallback trigger for Morning Briefings
    - cron: '35 22 * * *'
    # 17:25 KST (08:25 UTC Mon-Sat) - Optimal traffic minimum trigger for Daily Closing Briefing
    - cron: '25 8 * * 1-6'
    # 17:35 KST (08:35 UTC Mon-Sat) - Fallback trigger for Daily Closing Briefing
    - cron: '35 8 * * 1-6'
  workflow_dispatch:
    inputs:
      briefing_type:
        description: 'Select briefing to execute (all / morning / closing)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - morning
          - closing
      force:
        description: 'Force send even if already sent today'
        required: false
        default: false
        type: boolean

concurrency:
  group: scheduled-telegram-briefings
  cancel-in-progress: false

jobs:
  send-briefing:
    name: Run Telegram Daily Briefings (07:30 / 17:30)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Execute Telegram Briefings
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ github.event.inputs.briefing_type }}" = "morning" ]; then
            FLAGS="$FLAGS --morning"
          elif [ "${{ github.event.inputs.briefing_type }}" = "closing" ]; then
            FLAGS="$FLAGS --closing"
          fi
          echo "Executing Telegram Briefings with flags: $FLAGS..."
          node scripts/sendTelegramBriefing.mjs $FLAGS
