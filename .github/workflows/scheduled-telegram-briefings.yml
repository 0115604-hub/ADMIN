name: Scheduled Telegram Briefings

on:
  schedule:
    # 07:38 KST (22:38 UTC previous day) - Pre-warm trigger for 07:40 Morning Briefings
    - cron: '38 22 * * *'
    # 07:40 KST (22:40 UTC previous day) - Exact trigger for 07:40 Morning Briefings
    - cron: '40 22 * * *'
    # 07:42 KST (22:42 UTC previous day) - Fallback trigger for 07:40 Morning Briefings
    - cron: '42 22 * * *'
    # 17:28 KST (08:28 UTC Mon-Sat) - Pre-warm trigger for 17:30 Daily Closing Briefing
    - cron: '28 8 * * 1-6'
    # 17:30 KST (08:30 UTC Mon-Sat) - Exact trigger for 17:30 Daily Closing Briefing
    - cron: '30 8 * * 1-6'
    # 17:32 KST (08:32 UTC Mon-Sat) - Fallback trigger for 17:30 Daily Closing Briefing
    - cron: '32 8 * * 1-6'
  workflow_dispatch:
    inputs:
      briefing_type:
        description: 'Select briefing to execute (all / morning / closing)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - morning
          - closing
      force:
        description: 'Force send even if already sent today'
        required: false
        default: false
        type: boolean

concurrency:
  group: scheduled-telegram-briefings
  cancel-in-progress: false

jobs:
  send-briefing:
    name: Run Telegram Daily Briefings (07:40 / 17:30)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Execute Telegram Briefings
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ github.event.inputs.briefing_type }}" = "morning" ]; then
            FLAGS="$FLAGS --morning"
          elif [ "${{ github.event.inputs.briefing_type }}" = "closing" ]; then
            FLAGS="$FLAGS --closing"
          fi
          echo "Executing Telegram Briefings with flags: $FLAGS..."
          node scripts/sendTelegramBriefing.mjs $FLAGS
