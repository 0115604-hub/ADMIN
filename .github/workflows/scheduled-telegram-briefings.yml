name: Scheduled Telegram Briefings

on:
  schedule:
    # 07:28 KST (22:28 UTC previous day) - Pre-warm trigger (runner starts and waits until exactly 07:30:00 KST)
    - cron: '28 22 * * *'
    # 07:31 KST (22:31 UTC previous day) - Fallback trigger in case of GitHub Actions scheduler delay
    - cron: '31 22 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force send even if already sent today'
        required: false
        default: false
        type: boolean

concurrency:
  group: scheduled-telegram-briefings
  cancel-in-progress: false

jobs:
  send-briefing:
    name: Run Telegram Daily Briefings (07:30)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Execute Daily 07:30 Briefings
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          echo "Executing 07:30 KST Daily Morning & PnL Briefings $FORCE_FLAG..."
          node scripts/sendTelegramBriefing.mjs $FORCE_FLAG
