name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyCiHEInVCW1x2xnyw3eOW5oEubaCiwzZOg"
          VITE_FIREBASE_AUTH_DOMAIN: "profit-and-loss-7d09b.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "profit-and-loss-7d09b"
          VITE_FIREBASE_STORAGE_BUCKET: "profit-and-loss-7d09b.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "751528745146"
          VITE_FIREBASE_APP_ID: "1:751528745146:web:c9bc019f965942b3eaca83"
          VITE_FIREBASE_MEASUREMENT_ID: "G-2XSENS7QCB"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
